# Generated by `ergane init --wire`, then filled in by the operator.
#
# The job names below ARE the gate names. GitHub names each check run after the
# job's `name`, and the merge queue requires a check named after each declared
# gate — rename a job here and the factory refuses to dispatch against this repo.
#
# These must stay in lockstep with `gates:` in ergane.yaml. The node runs those
# commands inside bwrap; this workflow runs the same commands on a runner so the
# merge queue has a check to require. Two places, one contract: if they drift, a
# node can pass locally and be rejected at the queue, or vice versa.
name: ergane gates

on:
  pull_request:
  merge_group:

jobs:
  test:
    name: "test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      # `npm ci` needs a lockfile. Until 001-scaffold lands there is no
      # package.json at all and this job fails — which is correct: the gates are
      # declared before the toolchain that satisfies them exists, and a gate that
      # cannot run must fail rather than skip.
      - name: install
        run: npm ci || npm install
      # The smoke gate drives the built page in headless Chromium. On a runner the
      # browser can be installed here because HOME persists for the life of the
      # job — unlike an Ergane node, whose sandbox HOME is a tmpfs, which is why
      # the engine image bakes the browser in instead. Same gate, two ways of
      # satisfying the same prerequisite.
      - name: install chromium for the smoke gate
        run: npx --yes playwright install --with-deps chromium
      - name: "test"
        run: "npm run build && npm run test && npm run smoke"

  typecheck:
    name: "typecheck"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: install
        run: npm ci || npm install
      - name: "typecheck"
        run: "npm run typecheck"
