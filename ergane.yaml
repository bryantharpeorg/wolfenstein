# What "green" means for this repository. Every agent node dispatched here reads
# this file to learn which commands decide its fate. Declared, never auto-detected.
#
# Schema v1 — ergane specs/002-verification-gating/contracts/factory-yaml.md.
# Renamed factory.yaml -> ergane.yaml 2026-08-29: 0.5.0 prefers the new name and
# `resolve_manifest_path` lets ergane.yaml shadow a legacy factory.yaml silently.

# Schema v2 since 2026-09-03, and the bump has exactly one purpose: `ladder:` is a
# v2-only key, and v1 refuses it as unknown rather than ignoring it. Everything else
# in this file is a v1 key that v2 still recognises, so nothing below changed meaning.
version: 2

runtime: bwrap

# Three gates, and each one has to actually be installed or it FAILS the node
# rather than skipping it. All three are wired by 001-scaffold US3; a node
# dispatched before that lands will fail here, which is correct.
#
# `test` runs the vitest suite (pure logic: grid, collision, pathing, door
# machines, texture pixel math, damage). `smoke` is the load-bearing gate for a
# browser game — it drives the built page in headless Chromium, fails on any
# console error or uncaught exception, and reads window.__diag back to confirm
# the render loop is actually running. Compiling is not passing.
# Schema v1 fixes the legal gate names to `test`, `lint` and `typecheck` so the
# merge queue can map one required check to one gate. There is no `build` gate,
# so the build is folded into `test`, where it belongs anyway: `npm run smoke`
# drives the BUILT page, so a build failure has to fail the same gate the smoke
# run reports on. Compiling is not passing.
gates:
  # A node worktree is a fresh checkout: it has package.json and no node_modules,
  # so `npm run typecheck` resolves `tsc` against a bin directory that does not
  # exist and exits 127 in 0.16s. That is not a code failure, but the ladder
  # charges it to the node's attempt budget -- on 2026-08-30 it burned four
  # attempts in seven seconds on 006-enemies/us2 and escalated to a KILL that
  # took three pending siblings with it. Install first, and only when missing,
  # so a worktree the agent already prepared is not reinstalled on every gate.
  typecheck: "([ -x node_modules/.bin/tsc ] || npm ci --no-audit --no-fund) && npm run typecheck"
  test: "([ -x node_modules/.bin/tsc ] || npm ci --no-audit --no-fund) && npm run build && npm run test && npm run smoke"

# The document every agent attempt is told to read and obey.
standards: .specify/memory/constitution.md

# The branch the factory lands on. Declared by the operator, never by a node.
landing_branch: main

# The retry ladder. Every dial here is a platform default EXCEPT `promotion_persona`,
# which is the whole reason this block exists. Rung order is fixed in code
# (factory/verify/ladder.py:206-216), not by the order of these keys:
#
#     implementer x3  ->  promoter x1  ->  debugger x1  ->  escalate to the operator
#     glm-5.3-flash       claude-opus-5    claude-opus-5
#     metered             subscription     subscription
#
# `promotion_persona` names a ROLE, never a model: constitution VII keeps model names in
# ~/.config/ergane/personas.yaml alone, so this file says `promoter` and learns nothing
# about Opus. The models above are a comment, and a comment can go stale -- personas.yaml
# is the truth. Naming the persona here is what makes the rung exist at all: `promoter`
# has been defined since 2026-08-28 and had never once fired, because no manifest on this
# floor had ever named it and `_promotion_available()` returns False when
# `promotion_persona` is None. Defining a persona does not create a rung; this line does.
#
# The rung fires only after the ordinary budget is spent, and a promoted attempt does not
# consume that budget (`_attempts_spent` excludes it). That ordering still matters even
# though rung 2 is now free per token: `promotion_cycles` bounds how often the strongest
# model on the floor is spent on a story three cheaper attempts could not finish.
#
# RUNGS 2 AND 3 SHARE A MODEL and differ by persona -- `promoter` carries [implement, tdd],
# `debugger` carries [diagnosing-bugs]. That is a different approach on the same weights,
# not the "retry wearing a hat" personas.yaml warns about. If rung 3 turns out to add
# nothing over rung 2 in practice, the dial to change is `debugger_cycles: 0`.
#
# `max_attempts: 3` is unchanged and deliberate: rung 1 is now fast and cheap rather than
# slow and free, which is an argument for more swings, but every cycle-time measurement
# recorded in specs/README.md was taken at 3 and changing both the model and the budget
# in one move would leave neither attributable.
#
# The two dials NOT declared here are defaults on purpose. `max_judge_retries` (2) stays
# bounded INSIDE `max_attempts`, so the judge can never spend budget the operator did not
# grant it. `escalation_timeout_s` (3600) is how long an escalation waits on a human
# before the store writes EXPIRED, which ends the node -- shorten it only if someone is
# actually watching Telegram.
ladder:
  max_attempts: 3
  promotion_persona: promoter
  promotion_cycles: 1
  debugger_cycles: 1
